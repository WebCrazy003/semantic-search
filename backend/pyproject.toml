[project]
name = "semantic-pdf-search-backend"
version = "0.1.0"
description = "Offline semantic search over Chinese and Korean PDFs"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pymupdf>=1.24.10",
    "sentence-transformers>=3.0",
    "transformers>=4.44",
    "torch>=2.4",
    "qdrant-client>=1.10,<2",
    "huggingface-hub>=0.24",
    "numpy>=1.26",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not integration' --strict-markers"
markers = [
    "integration: needs a running Qdrant and the local BGE-M3 model",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# FastAPI's Depends() in a default argument is the framework's own idiom.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Test fixtures embed CJK sample sentences that cannot be wrapped without changing them.
"tests/*" = ["E501"]
